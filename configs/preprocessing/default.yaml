# @package preprocessing
target_fps: 25
max_frames_per_video: 500

face_mesh:
  static_image_mode: false
  max_num_faces: 1
  refine_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

mouth_roi:
  output_size: [96, 96]
  crop_factor: 1.5
  temporal_smooth_alpha: 0.7

whisper:
  model_size: large-v3
  device: cuda
  language: ar
  initial_prompt: null
  beam_size: 5

tokenizer:
  vocab_size: 5000
  model_type: bpe
  character_coverage: 1.0
