# @package training
max_epochs: 100
gradient_clip_val: 5.0
accumulate_grad_batches: 4
precision: 16-mixed
val_check_interval: 1.0
log_every_n_steps: 10

loss_weights:
  ctc: 1.0
  kd: 0.5
  feature_regression: 0.1

kd:
  temperature: 4.0

feature_regression:
  student_dim: 256
  teacher_dim: 1280   # Whisper-Large-V3 hidden dim

teacher:
  model_size: large-v3
  device: cuda
  cache_dir: null

callbacks:
  early_stopping:
    monitor: val/wer
    patience: 15
    mode: min
  model_checkpoint:
    monitor: val/wer
    save_top_k: 3
    mode: min
    filename: "{epoch:02d}-{val_wer:.4f}"
    dirpath: checkpoints/
    save_last: true
    auto_insert_metric_name: false
  lr_monitor:
    logging_interval: step
