# @package model
_target_: lsparabic.models.vsr_model.VSRModel

visual_encoder:
  _target_: lsparabic.models.visual_encoder.ResNet3D
  output_dim: 512
  pretrained: false

sequence_model:
  _target_: lsparabic.models.conformer.ConformerEncoder
  input_dim: 512
  d_model: 256
  num_layers: 6
  num_heads: 4
  ffn_expansion: 4
  conv_kernel_size: 31
  dropout: 0.1

decoder:
  _target_: lsparabic.models.decoder.CTCDecoder
  input_dim: 256
  vocab_size: ???   # resolved at runtime from tokenizer.vocab_size

proj_dim: 256
